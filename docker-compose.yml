services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-RegistraCV!Dev2026}
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  backend:
    build: ./backend
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/prisma
    environment:
      PORT: ${SERVER_PORT:-3000}
      DB_HOST: database
      DB_PORT: ${DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-RegistraCV}
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-RegistraCV!Dev2026}
      DATABASE_URL: "sqlserver://database:${DB_PORT:-1433};database=${DB_NAME:-RegistraCV};user=sa;password=${MSSQL_SA_PASSWORD:-RegistraCV!Dev2026};encrypt=true;trustServerCertificate=true"
    ports:
      - "${SERVER_PORT:-3000}:3000"
    volumes:
      - ./backend/storage:/app/storage
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
          initial_sync: true
          ignore:
            - node_modules/
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile
        - action: rebuild
          path: ./frontend/vite.config.js
    environment:
      VITE_API_URL: http://localhost:${SERVER_PORT:-3000}/api
    ports:
      - "${CLIENT_PORT:-8000}:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlserver_data:
